<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حاسبة تحويل العملات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a84ff;
            --accent-cyan: #64d2ff;
            --accent-purple: #bf5af2;
            --bg-color: #020204;
            --card-bg: rgba(15, 15, 22, 0.85);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.12);
            --input-bg: #1c1c1e;
            --accent-green: #30d158;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            background-color: #0a0a0f;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            overflow-y: auto;
            padding-top: max(env(safe-area-inset-top), 12px);
            padding-bottom: max(env(safe-area-inset-bottom), 12px);
            padding-left: 12px;
            padding-right: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 1.2rem;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.2rem;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .grid::-webkit-scrollbar {
            width: 6px;
        }

        .grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border-radius: 1.2rem;
            padding: 1.2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            animation: scanline 3s infinite;
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.6rem;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .input-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.9rem 0.5rem;
            border: 1.5px solid var(--border-color);
            border-radius: 0.85rem;
            font-size: 1.1rem !important;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            background-color: var(--input-bg);
            -webkit-appearance: none;
            appearance: none;
            line-height: 1.5;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(10, 132, 255, 0.4);
            background-color: #2c2c2e;
        }

        select {
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2364d2ff' height='20' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: left 0.6rem center;
            background-size: 18px;
            padding-left: 2rem;
            cursor: pointer;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .currency-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border-color);
            padding: 0.8rem 0.3rem;
            border-radius: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .currency-item:active {
            transform: scale(0.94);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(100, 210, 255, 0.3);
        }

        .currency-item .name {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .currency-item .val {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-top: 0.2rem;
            direction: ltr;
        }

        .editable-rates {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        .editable-rates .form-group {
            margin-bottom: 0;
        }

        .editable-rates label {
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
        }

        .editable-rates input {
            padding: 0.8rem 0.3rem;
            font-size: 1rem !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        th, td {
            padding: 0.8rem 0.4rem;
            text-align: center;
            border-bottom: 1.5px solid var(--border-color);
            color: #fff;
        }

        th {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 1.05rem;
        }

        td {
            font-weight: 600;
        }

        .fix-badge {
            background-color: rgba(48, 209, 88, 0.2);
            color: var(--accent-green);
            padding: 0.2rem 0.5rem;
            border-radius: 0.35rem;
            font-size: 0.85rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
<canvas id="galaxy-canvas"></canvas>
<div class="container">
    <header>
        <h1>تحويل العملات</h1>
        <p>أمام درب التبانة السحرية</p>
    </header>
    <div class="grid">
        <div class="card">
            <div class="card-title">📊 منصة تحويل العملات</div>
            <div class="input-row">
                <div class="form-group">
                    <label>المبلغ:</label>
                    <input type="number" id="amount" value="1" min="0" step="any" inputmode="decimal" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label>من:</label>
                    <select id="fromCurrency" onchange="calculate()">
                        <option value="USD">دولار</option>
                        <option value="IQD">عراقي</option>
                        <option value="SYP">سوري</option>
                        <option value="TRY">تركي</option>
                    </select>
                </div>
            </div>
            <div class="results-grid" id="conversionResults"></div>
        </div>

        <div class="card">
            <div class="card-title">⚙️ أسعار الصرف</div>
            <div class="editable-rates">
                <div class="form-group">
                    <label>العراقي</label>
                    <input type="number" id="rate_IQD" value="153.6" step="0.1" oninput="updateRates()">
                </div>
                <div class="form-group">
                    <label>السوري</label>
                    <input type="number" id="rate_SYP" value="133" step="0.1" oninput="updateRates()">
                </div>
                <div class="form-group">
                    <label>التركي</label>
                    <input type="number" id="rate_TRY" value="47.21" step="0.1" oninput="updateRates()">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 جدول المقارنة</div>
            <div style="overflow-x: auto; margin-bottom: 2rem;">
                <table>
                    <thead>
                        <tr>
                            <th>الأساس</th>
                            <th>$</th>
                            <th>د.ع</th>
                            <th>ل.س</th>
                            <th>₺</th>
                        </tr>
                    </thead>
                    <tbody id="matrixTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let rotation = 0;

    function drawMilkyWay() {
        // خلفية سوداء نقية
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // مركز درب التبانة
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        rotation += 0.0008;

        // رسم ذراعي درب التبانة الرئيسيين بتفاصيل عالية
        for (let arm = 0; arm < 2; arm++) {
            const armRotation = rotation + (Math.PI * arm);
            
            // رسم نقاط النجوم في الذراع بكثافة عالية
            for (let i = 0; i < 800; i++) {
                const distance = (i / 800) * 500;
                const angle = armRotation + (i / 800) * Math.PI * 1.5;
                
                // إضافة موجات واهتزازات للذراع
                const waveOffset = Math.sin(angle * 3) * 30;
                const spiralX = centerX + Math.cos(angle) * (distance + waveOffset);
                const spiralY = centerY + Math.sin(angle) * (distance + waveOffset);

                // تدرج الكثافة - أكثر في الوسط
                const density = Math.exp(-i / 400) * 255;
                const brightness = 100 + Math.random() * density;
                
                // ألوان واقعية للمجرة
                let starColor;
                const rand = Math.random();
                if (rand < 0.7) {
                    // نجوم بيضاء زرقاء
                    starColor = `rgba(200, 220, 255, ${(brightness / 255) * 0.6})`;
                } else if (rand < 0.9) {
                    // نجوم برتقالية
                    starColor = `rgba(255, 180, 100, ${(brightness / 255) * 0.5})`;
                } else {
                    // نجوم حمراء
                    starColor = `rgba(255, 100, 80, ${(brightness / 255) * 0.4})`;
                }

                ctx.fillStyle = starColor;
                const size = Math.random() * 1.5;
                ctx.beginPath();
                ctx.arc(spiralX, spiralY, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // رسم النواة المركزية الساطعة
        const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 150);
        coreGradient.addColorStop(0, 'rgba(255, 200, 150, 0.8)');
        coreGradient.addColorStop(0.3, 'rgba(200, 150, 255, 0.6)');
        coreGradient.addColorStop(0.7, 'rgba(100, 150, 255, 0.3)');
        coreGradient.addColorStop(1, 'rgba(100, 100, 255, 0)');
        
        ctx.fillStyle = coreGradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
        ctx.fill();

        // إضافة توهج حول المجرة
        const glowGradient = ctx.createRadialGradient(centerX, centerY, 200, centerX, centerY, 600);
        glowGradient.addColorStop(0, 'rgba(100, 150, 200, 0.1)');
        glowGradient.addColorStop(1, 'rgba(100, 150, 200, 0)');
        
        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 600, 0, Math.PI * 2);
        ctx.fill();

        // بعض النجوم الخلفية العشوائية
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        for (let i = 0; i < 150; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const size = Math.random() * 1;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(drawMilkyWay);
    }
    drawMilkyWay();

    // حسابات تحويل العملات
    const rates = { USD: 1, IQD: 153.6, SYP: 133, TRY: 47.21 };
    const names = { USD: "دولار", IQD: "عراقي", SYP: "سوري", TRY: "تركي" };
    const symbols = { USD: "$", IQD: "د.ع", SYP: "ل.س", TRY: "₺" };

    function loadSavedRates() {
        const saved = localStorage.getItem('rates');
        if (saved) {
            Object.assign(rates, JSON.parse(saved));
            document.getElementById('rate_IQD').value = rates.IQD;
            document.getElementById('rate_SYP').value = rates.SYP;
            document.getElementById('rate_TRY').value = rates.TRY;
        }
    }

    function updateRates() {
        rates.IQD = parseFloat(document.getElementById('rate_IQD').value) || 0;
        rates.SYP = parseFloat(document.getElementById('rate_SYP').value) || 0;
        rates.TRY = parseFloat(document.getElementById('rate_TRY').value) || 0;
        localStorage.setItem('rates', JSON.stringify(rates));
        calculate();
        renderMatrix();
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const from = document.getElementById('fromCurrency').value;
        const amountInUSD = amount / rates[from];
        document.getElementById('conversionResults').innerHTML = '';

        for (let curr in rates) {
            if (curr !== from) {
                const val = (amountInUSD * rates[curr]).toLocaleString('en-US', { maximumFractionDigits: curr === 'USD' ? 3 : 1 });
                document.getElementById('conversionResults').innerHTML += `<div class="currency-item"><div class="name">${names[curr]}</div><div class="val">${val} ${symbols[curr]}</div></div>`;
            }
        }
    }

    function renderMatrix() {
        const tbody = document.getElementById('matrixTable');
        tbody.innerHTML = '';
        ['USD', 'TRY'].forEach(base => {
            let html = `<tr><td><strong>1 ${names[base]}</strong></td>`;
            const baseUSD = 1 / rates[base];
            ['USD', 'IQD', 'SYP', 'TRY'].forEach(t => {
                const v = (baseUSD * rates[t]).toLocaleString('en-US', { maximumFractionDigits: 2 });
                html += `<td>${v}</td>`;
            });
            tbody.innerHTML += html + '</tr>';
        });
    }

    window.onload = () => { loadSavedRates(); calculate(); renderMatrix(); };
</script>
</body>
</html>
