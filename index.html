<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حاسبة تحويل العملات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a84ff;
            --accent-cyan: #64d2ff;
            --accent-purple: #bf5af2;
            --bg-color: #020204;
            --card-bg: rgba(15, 15, 22, 0.7);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.12);
            --input-bg: #1c1c1e;
            --accent-green: #30d158;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: max(env(safe-area-inset-top), 8px) 8px max(env(safe-area-inset-bottom), 8px) 8px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        #ai-bg, #stars-bg, #galaxy-bg, #constellations-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        #stars-bg { z-index: 1; }
        #galaxy-bg { z-index: 2; }
        #constellations-bg { z-index: 3; }
        #ai-bg { z-index: 4; }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 0.8rem;
            padding: 0.4rem 0;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 0.1rem;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border-radius: 1rem;
            padding: 0.8rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            animation: scanline 3s infinite;
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 0.6rem;
        }

        .input-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        input, select {
            width: 100%;
            padding: 0.6rem 0.35rem;
            border: 1px solid var(--border-color);
            border-radius: 0.65rem;
            font-size: 14px !important;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            background-color: var(--input-bg);
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(10, 132, 255, 0.3);
            background-color: #2c2c2e;
        }

        select {
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2364d2ff' height='16' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: left 0.5rem center;
            background-size: 14px;
            padding-left: 1.6rem;
            cursor: pointer;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.3rem;
            margin-top: 0.6rem;
        }

        .currency-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.15rem;
            border-radius: 0.7rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .currency-item:active {
            transform: scale(0.94);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(100, 210, 255, 0.25);
        }

        .currency-item .name {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .currency-item .val {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-top: 0.1rem;
            direction: ltr;
        }

        .editable-rates {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.35rem;
        }

        .editable-rates .form-group {
            margin-bottom: 0;
        }

        .editable-rates label {
            font-size: 0.65rem;
            margin-bottom: 0.2rem;
        }

        .editable-rates input {
            padding: 0.5rem 0.2rem;
            font-size: 12px !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        th, td {
            padding: 0.4rem 0.2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            color: #fff;
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            font-weight: 700;
        }

        .fix-badge {
            background-color: rgba(48, 209, 88, 0.15);
            color: var(--accent-green);
            padding: 0.1rem 0.3rem;
            border-radius: 0.25rem;
            font-size: 0.6rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
<canvas id="stars-bg"></canvas>
<canvas id="galaxy-bg"></canvas>
<canvas id="constellations-bg"></canvas>
<canvas id="ai-bg"></canvas>
<div class="container">
    <header>
        <h1>تحويل العملات</h1>
        <p>برنامج ذكي سريع بتصميم كوني احترافي</p>
    </header>
    <div class="grid">
        <div class="card">
            <div class="card-title">📊 التحويل السريع</div>
            <div class="input-row">
                <div class="form-group">
                    <label>المبلغ:</label>
                    <input type="number" id="amount" value="1" min="0" step="any" inputmode="decimal" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label>من:</label>
                    <select id="fromCurrency" onchange="calculate()">
                        <option value="USD">دولار</option>
                        <option value="IQD">عراقي</option>
                        <option value="SYP">سوري</option>
                        <option value="TRY">تركي</option>
                    </select>
                </div>
            </div>
            <div class="results-grid" id="conversionResults"></div>
        </div>

        <div class="card">
            <div class="card-title">⚙️ أسعار الصرف</div>
            <div class="editable-rates">
                <div class="form-group">
                    <label>العراقي</label>
                    <input type="number" id="rate_IQD" value="153.6" step="0.1" oninput="updateRates()">
                </div>
                <div class="form-group">
                    <label>السوري</label>
                    <input type="number" id="rate_SYP" value="133" step="0.1" oninput="updateRates()">
                </div>
                <div class="form-group">
                    <label>التركي</label>
                    <input type="number" id="rate_TRY" value="47.21" step="0.1" oninput="updateRates()">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 جدول المقارنة</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>الأساس</th>
                            <th>$</th>
                            <th>د.ع</th>
                            <th>ل.س</th>
                            <th>₺</th>
                        </tr>
                    </thead>
                    <tbody id="matrixTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== النجوم الخلفية =====
    const starsCanvas = document.getElementById('stars-bg');
    const starsCtx = starsCanvas.getContext('2d');
    const galaxyCanvas = document.getElementById('galaxy-bg');
    const galaxyCtx = galaxyCanvas.getContext('2d');
    const constellationsCanvas = document.getElementById('constellations-bg');
    const consCtx = constellationsCanvas.getContext('2d');
    const aiCanvas = document.getElementById('ai-bg');
    const aiCtx = aiCanvas.getContext('2d');

    let particles = [], ripples = [];
    let mouse = { x: null, y: null, radius: 140 };

    function resizeCanvas() {
        starsCanvas.width = galaxyCanvas.width = constellationsCanvas.width = aiCanvas.width = window.innerWidth;
        starsCanvas.height = galaxyCanvas.height = constellationsCanvas.height = aiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // رسم النجوم الثابتة
    function drawStars() {
        starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
        for (let i = 0; i < 300; i++) {
            const x = Math.sin(i) * starsCanvas.width + starsCanvas.width / 2;
            const y = Math.cos(i * 0.5) * starsCanvas.height + starsCanvas.height / 2;
            const size = Math.random() * 1.5;
            const opacity = Math.random() * 0.7 + 0.3;
            starsCtx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            starsCtx.beginPath();
            starsCtx.arc(x % starsCanvas.width, y % starsCanvas.height, size, 0, Math.PI * 2);
            starsCtx.fill();
        }
    }

    // رسم درب التبانة والمجرات
    let galaxyRotation = 0;
    function drawGalaxy() {
        galaxyCtx.clearRect(0, 0, galaxyCanvas.width, galaxyCanvas.height);
        galaxyRotation += 0.0002;

        // مجرة درب التبانة (الرئيسية)
        drawGalaxySpiral(galaxyCanvas.width * 0.2, galaxyCanvas.height * 0.3, 150, galaxyRotation, '#64d2ff', 0.3);
        
        // مجرة أندروميدا
        drawGalaxySpiral(galaxyCanvas.width * 0.8, galaxyCanvas.height * 0.2, 100, galaxyRotation * 0.7, '#bf5af2', 0.2);
        
        // مجرة صغيرة
        drawGalaxySpiral(galaxyCanvas.width * 0.15, galaxyCanvas.height * 0.85, 70, galaxyRotation * 1.3, '#ff6b9d', 0.15);
    }

    function drawGalaxySpiral(cx, cy, radius, rotation, color, opacity) {
        for (let i = 0; i < 200; i++) {
            const angle = (i / 200) * Math.PI * 4 + rotation;
            const r = (i / 200) * radius;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            const size = Math.random() * 2 + 1;
            
            const gradient = galaxyCtx.createRadialGradient(cx, cy, 0, cx, cy, radius);
            galaxyCtx.fillStyle = `rgba(100, 210, 255, ${opacity * (1 - i / 200)})`;
            galaxyCtx.beginPath();
            galaxyCtx.arc(x, y, size, 0, Math.PI * 2);
            galaxyCtx.fill();
        }
    }

    // رسم الأبراج النجمية
    const constellations = [
        { name: 'الدب الأكبر', stars: [[100, 100], [150, 120], [200, 110], [220, 150], [180, 180], [140, 170], [110, 160]], color: '#64d2ff' },
        { name: 'الدب الأصغر', stars: [[700, 80], [720, 100], [750, 110], [780, 100], [800, 120]], color: '#bf5af2' },
        { name: 'الجبار', stars: [[100, 400], [150, 380], [180, 420], [200, 390], [160, 450]], color: '#ffd700' },
        { name: 'الثور', stars: [[600, 350], [650, 330], [700, 360], [670, 390]], color: '#ff6b9d' }
    ];

    function drawConstellations() {
        consCtx.clearRect(0, 0, constellationsCanvas.width, constellationsCanvas.height);
        
        constellations.forEach(constellation => {
            // رسم خطوط الأبراج
            consCtx.strokeStyle = `${constellation.color}40`;
            consCtx.lineWidth = 1;
            for (let i = 0; i < constellation.stars.length - 1; i++) {
                consCtx.beginPath();
                consCtx.moveTo(constellation.stars[i][0], constellation.stars[i][1]);
                consCtx.lineTo(constellation.stars[i + 1][0], constellation.stars[i + 1][1]);
                consCtx.stroke();
            }

            // رسم النجوم
            constellation.stars.forEach(star => {
                consCtx.fillStyle = constellation.color;
                consCtx.beginPath();
                consCtx.arc(star[0], star[1], 3, 0, Math.PI * 2);
                consCtx.fill();
                
                // إضاءة حول النجوم
                consCtx.fillStyle = `${constellation.color}20`;
                consCtx.beginPath();
                consCtx.arc(star[0], star[1], 8, 0, Math.PI * 2);
                consCtx.fill();
            });
        });
    }

    // مؤثرات التفاعل (الجزيئات)
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', (e) => { if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });
    window.addEventListener('pointerdown', (e) => { ripples.push({ x: e.clientX, y: e.clientY, radius: 0, alpha: 1 }); });
    window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

    class Particle {
        constructor() {
            this.x = Math.random() * aiCanvas.width;
            this.y = Math.random() * aiCanvas.height;
            this.vx = (Math.random() - 0.5) * 1.2;
            this.vy = (Math.random() - 0.5) * 1.2;
            this.baseRadius = Math.random() * 1.8 + 0.8;
            this.colorHue = Math.random() > 0.5 ? 210 : 270;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > aiCanvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > aiCanvas.height) this.vy *= -1;

            if (mouse.x != null) {
                let dx = mouse.x - this.x, dy = mouse.y - this.y, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    let angle = Math.atan2(dy, dx), force = (mouse.radius - dist) / mouse.radius;
                    this.x -= Math.cos(angle) * force * 3;
                    this.y -= Math.sin(angle) * force * 3;
                }
            }
        }

        draw() {
            aiCtx.beginPath();
            aiCtx.arc(this.x, this.y, this.baseRadius, 0, Math.PI * 2);
            aiCtx.fillStyle = `hsl(${this.colorHue}, 100%, 65%)`;
            aiCtx.shadowBlur = 8;
            aiCtx.shadowColor = `hsl(${this.colorHue}, 100%, 65%)`;
            aiCtx.fill();
        }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animate() {
        aiCtx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);

        for (let i = ripples.length - 1; i >= 0; i--) {
            let r = ripples[i];
            r.radius += 3;
            r.alpha -= 0.025;
            aiCtx.beginPath();
            aiCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            aiCtx.strokeStyle = `rgba(100, 210, 255, ${r.alpha})`;
            aiCtx.lineWidth = 1.2;
            aiCtx.stroke();
            if (r.alpha <= 0) ripples.splice(i, 1);
        }

        particles.forEach((p, i) => {
            p.update();
            p.draw();
            for (let j = i + 1; j < particles.length; j++) {
                let dx = p.x - particles[j].x, dy = p.y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 110) {
                    aiCtx.beginPath();
                    aiCtx.moveTo(p.x, p.y);
                    aiCtx.lineTo(particles[j].x, particles[j].y);
                    aiCtx.strokeStyle = `rgba(100, 210, 255, ${(1 - dist / 110) * 0.3})`;
                    aiCtx.lineWidth = 0.6;
                    aiCtx.stroke();
                }
            }
        });
        
        requestAnimationFrame(animate);
    }

    // تحديث الخلفية
    function animateBackground() {
        drawStars();
        drawGalaxy();
        drawConstellations();
        animate();
        requestAnimationFrame(animateBackground);
    }
    animateBackground();

    // حسابات تحويل العملات
    const rates = { USD: 1, IQD: 153.6, SYP: 133, TRY: 47.21 };
    const names = { USD: "دولار", IQD: "عراقي", SYP: "سوري", TRY: "تركي" };
    const symbols = { USD: "$", IQD: "د.ع", SYP: "ل.س", TRY: "₺" };

    function loadSavedRates() {
        const saved = localStorage.getItem('rates');
        if (saved) {
            Object.assign(rates, JSON.parse(saved));
            document.getElementById('rate_IQD').value = rates.IQD;
            document.getElementById('rate_SYP').value = rates.SYP;
            document.getElementById('rate_TRY').value = rates.TRY;
        }
    }

    function updateRates() {
        rates.IQD = parseFloat(document.getElementById('rate_IQD').value) || 0;
        rates.SYP = parseFloat(document.getElementById('rate_SYP').value) || 0;
        rates.TRY = parseFloat(document.getElementById('rate_TRY').value) || 0;
        localStorage.setItem('rates', JSON.stringify(rates));
        calculate();
        renderMatrix();
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const from = document.getElementById('fromCurrency').value;
        const amountInUSD = amount / rates[from];
        document.getElementById('conversionResults').innerHTML = '';

        for (let curr in rates) {
            if (curr !== from) {
                const val = (amountInUSD * rates[curr]).toLocaleString('en-US', { maximumFractionDigits: curr === 'USD' ? 3 : 1 });
                document.getElementById('conversionResults').innerHTML += `<div class="currency-item"><div class="name">${names[curr]}</div><div class="val">${val} ${symbols[curr]}</div></div>`;
            }
        }
    }

    function renderMatrix() {
        const tbody = document.getElementById('matrixTable');
        tbody.innerHTML = '';
        ['USD', 'TRY'].forEach(base => {
            let html = `<tr><td><strong>1 ${names[base]}</strong></td>`;
            const baseUSD = 1 / rates[base];
            ['USD', 'IQD', 'SYP', 'TRY'].forEach(t => {
                const v = (baseUSD * rates[t]).toLocaleString('en-US', { maximumFractionDigits: 2 });
                html += `<td>${v}</td>`;
            });
            tbody.innerHTML += html + '</tr>';
        });
    }

    window.onload = () => { loadSavedRates(); calculate(); renderMatrix(); };
</script>
</body>
</html>
